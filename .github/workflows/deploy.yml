name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lightgravity/app:${{ github.sha }}
  SERVICE: lightgravity-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        # Single instance: sessions, SQLite and the task queue are in-process.
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated --min-instances 1 --max-instances 1 \
            --no-cpu-throttling --cpu 1 --memory 1Gi
          HOST=$(gcloud run services describe "$SERVICE" --region ${{ vars.GCP_REGION }} --format 'value(status.url)' | sed 's#https://##')
          gcloud run services update "$SERVICE" --region ${{ vars.GCP_REGION }} \
            --update-env-vars "LIGHTGRAVITY_ALLOWED_HOSTS=$HOST"
