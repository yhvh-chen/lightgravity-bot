[project]
name = "lightgravity-bot"
version = "0.1.0"
description = "LightGravity Bot — an AI workspace for individuals and small teams."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    "google-antigravity==0.1.22",
    "pypdfium2>=5,<6",
]

[project.optional-dependencies]

[project.scripts]
lightgravity = "lightgravity.cli:main"
lg = "lightgravity.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lightgravity"]


[tool.mypy]
python_version = "3.12"
files = ["backend/lightgravity"]
mypy_path = "backend"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
