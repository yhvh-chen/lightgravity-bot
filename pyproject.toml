[project]
name = "lightgravity-bot"
version = "0.1.0"
description = "LightGravity Bot — local AI task assistant. Engineering skeleton only (LG-002)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    # Pinned by LG-003 and locked for LG-005 (adapter config compilation).
    # The adapter is the only module allowed to import it (docs/08 §8).
    "google-antigravity==0.1.22",
    # LG-035: PDF page rasterisation for OCR.  pypdfium2 ships a self-contained
    # permissively licensed wheel (BSD-3-Clause + Apache-2.0 + bundled
    # permissive deps; no GPL/AGPL, no system poppler).  It is imported lazily
    # by the source OCR adapter only, so non-PDF paths do not need it at import
    # time.  License provenance is recorded in probes/lg035/QUALITY-PLAN.md.
    "pypdfium2>=5,<6",
]

[project.optional-dependencies]
# 1.20 optional English ASR runtime (LG-160).  The default application does not
# install or import these; without this extra the capability is honestly false.
# torch==2.14.0 is CPU-compatible; on Linux install the CPU wheel from the
# official PyTorch CPU index in the isolated runtime environment if desired
# (``pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu``).
english-asr = [
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "torch==2.14.0",
    "transformers==5.19.0",
]

[project.scripts]
lightgravity = "lightgravity.cli:main"
lg = "lightgravity.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lightgravity"]
# LG-120: the complete pinned role library is package data, not a runtime clone.
# Both directives are explicit so a VCS-ignore or filtering change cannot drop it.
include = ["backend/lightgravity/runtime/roles/agency/**"]
artifacts = ["backend/lightgravity/runtime/roles/agency/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["backend/lightgravity"]
mypy_path = "backend"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# The pinned SDK ships no py.typed marker; keep its symbols opaque instead of
# failing the whole package on missing stubs. Only the adapter imports it, and
# it does so lazily/behind a guarded boundary.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

# pypdfium2 ships no py.typed marker; it is imported lazily inside the OCR PDF
# rasteriser only (LG-035).  Keep its symbols opaque rather than failing.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# The optional English ASR runtime imports these only lazily, and the default
# development environment may not install the `english-asr` extra.  Keep their
# symbols opaque instead of failing the whole package on missing stubs.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "safetensors",
    "safetensors.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
