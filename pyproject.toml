[project]
name = "lightgravity-bot"
version = "0.1.0"
description = "LightGravity Bot — local AI task assistant. Engineering skeleton only (LG-002)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
# Kept empty intentionally: the Antigravity SDK is added only after LG-003
# confirms a pinned version and platform wheel. The adapter package must not
# import it before then (see docs/08-interface-contract.md §8).

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/lightgravity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["backend/lightgravity"]
mypy_path = "backend"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
