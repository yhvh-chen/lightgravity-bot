[project]
name = "lg003-antigravity-probes"
version = "0.1.0"
description = "LG-003 isolated probe environment for the Antigravity SDK (google-antigravity). Not part of the LightGravity product package."
requires-python = ">=3.12,<3.13"
# Fixed probe target. LG-003 must confirm the exact installed version and
# platform wheel before the product may add this dependency (docs/08 §2.2).
dependencies = [
    "google-antigravity==0.1.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
# Keep this environment fully independent from the repository root project.
package = false
